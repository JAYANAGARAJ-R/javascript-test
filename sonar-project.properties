# SonarQube Cloud CI-based analysis. Automatic Analysis cannot change language
# detection, so it never indexes the extensionless gradlew or the Java fixtures.
sonar.organization=jayanagaraj-r
sonar.projectKey=JAYANAGARAJ-R_javascript-test
sonar.sources=.
sonar.exclusions=node_modules/**,expected/**,public/vendor/**

# gradlew has no extension, so the default shell suffixes (.sh, .bash) skip it.
# Setting the patterns replaces the suffix list, hence the suffixes are repeated.
sonar.lang.patterns.shell=**/*.sh,**/*.bash,**/gradlew

# The Java fixtures are never compiled; point the analyzer at an empty directory
# so it runs without bytecode instead of failing the scan.
sonar.java.binaries=.sonar-empty
